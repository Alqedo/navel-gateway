name: Bug report
description: Report a reproducible gateway problem.
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, registration codes, raw MQTT captures or Home Assistant storage files. Report vulnerabilities privately as described in SECURITY.md."
  - type: textarea
    id: versions
    attributes:
      label: Versions and setup
      description: Home Assistant, Navel Gateway, Agua IOT build, installation type and stove model/firmware if known.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened?
      description: Steps to reproduce, expected result and actual result.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized errors
      description: Remove secrets and personal information before submitting.
      render: text
